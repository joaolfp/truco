[settings]
lockfile = true

[tools]
zizmor = "latest"

[tasks.lint]
run = "cargo clippy --all-targets --all-features"

[tasks.release]
run = "cargo build --release"

[tasks.build]
run = "cargo build"

[tasks.cli]
run = "cargo run"

[tasks.test]
run = "cargo test"

[tasks.check]
run = "cargo check"

[tasks.doc]
run = "cargo doc --no-deps"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.lint-spacing]
description = "Check blank lines around blocks (for, if, match, ...)"
run = "python3 scripts/lint_spacing.py"

[tasks.lint-spacing-fix]
description = "Insert the missing blank lines around blocks"
run = "python3 scripts/lint_spacing.py --fix"

[tasks.zizmor]
run = "zizmor .github/workflows"
