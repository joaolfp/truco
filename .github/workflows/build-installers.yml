name: Build installers

# Builds the installers that players download from the landing page:
#   Windows -> Truco-Windows-Setup.exe     (NSIS installer)
#   macOS   -> Truco-macOS.dmg             (universal: Apple Silicon + Intel)
#   Linux   -> Truco-Linux-x86_64.AppImage and Truco-Linux-amd64.deb
#
# The file names never change between versions, so the landing page can link
# to https://github.com/joaolfp/truco/releases/latest/download/<file>.
#
# - Called by release-plz.yml right after a release is created: uploads the
#   installers to that GitHub release.
# - On pull requests that touch packaging: only builds, as a check
#   (the installers are kept as workflow artifacts).
# - Manually (Actions tab): builds a tag and uploads to its release.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. v0.2.0)
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/build-installers.yml
      - Cargo.toml
      - build.rs
      - assets/**
      - src/main.rs

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            # Oldest supported runner: an older glibc makes the AppImage run
            # on more distributions.
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install AppImage dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - uses: Swatinem/rust-cache@11da8522bc3856a8fbc565f1d1530989c793d67d

      - name: Install cargo-packager
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-packager@0.11.8

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked
          cargo packager --release -f nsis
          mkdir dist
          cp target/release/*-setup.exe dist/Truco-Windows-Setup.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/truco \
            target/aarch64-apple-darwin/release/truco \
            target/x86_64-apple-darwin/release/truco
          cargo packager --release --target universal-apple-darwin -f dmg
          mkdir dist
          cp target/universal-apple-darwin/release/*.dmg dist/Truco-macOS.dmg

      - name: Package (Linux)
        if: runner.os == 'Linux'
        env:
          # linuxdeploy is itself an AppImage; run it without mounting FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cargo build --release --locked
          cargo packager --release -f appimage,deb
          mkdir dist
          cp target/release/*.AppImage dist/Truco-Linux-x86_64.AppImage
          cp target/release/*.deb dist/Truco-Linux-amd64.deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to the GitHub release
        if: inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
